<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital ZN - Quotation</title>

    <link rel="stylesheet" href="print.css">

</head>

<body>

<div class="page">

    <header class="header">

        <div>

            <h1>DIGITAL ZN</h1>

            <p>Creative Digital Solutions</p>

        </div>

        <div class="quote-number">

            <h2>QUOTATION</h2>

            <span id="quote-id"></span>

        </div>

    </header>

    <hr>

    <section class="client">

        <div>

            <strong>Client</strong>

            <p id="client">-</p>

        </div>

        <div>

            <strong>Project</strong>

            <p id="project">-</p>

        </div>

        <div>

            <strong>Date</strong>

            <p id="date">-</p>

        </div>

    </section>

    <h3>Services</h3>

    <table>

        <thead>

        <tr>

            <th>Service</th>

            <th>Qty</th>

            <th>Unit Price</th>

            <th>Total</th>

        </tr>

        </thead>

        <tbody id="services">

        </tbody>

    </table>

    <div class="summary">

        <table>

            <tr>

                <td>Project Total</td>

                <td id="invoice"></td>

            </tr>

            <tr>

                <td>Business Costs</td>

                <td id="costs"></td>

            </tr>

            <tr>

                <td>Estimated Profit</td>

                <td id="profit"></td>

            </tr>

            <tr class="recommended">

                <td>Recommended Price</td>

                <td id="recommend"></td>

            </tr>

        </table>

    </div>

    <footer>

        <p><strong>Prepared by</strong></p>

        <p>Digital ZN</p>

        <p>contact@digital-zn.com</p>

        <p>www.digital-zn.com</p>

    </footer>

</div>

<script src="print.js"></script>

</body>
</html>
