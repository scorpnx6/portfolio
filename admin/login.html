<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital ZN — Business Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
  <link rel="icon" type="image/png" href="../assets/logo.png" />
</head>
<body>

  <!-- Animated background mesh -->
  <div class="bg-mesh">
    <div class="mesh-orb mesh-orb-1"></div>
    <div class="mesh-orb mesh-orb-2"></div>
    <div class="mesh-orb mesh-orb-3"></div>
  </div>

  <!-- Grid overlay -->
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Left branding panel -->
  <aside class="panel-brand">
    <div class="videoss">
          <video src="..\assets\loggointro.mp4" autoplay muted loop></video>
    </div>
  </aside>

  <!-- Right form panel -->
  <main class="panel-form">
    <div class="form-card">

      <!-- Mobile logo (hidden on desktop) -->
      <div class="mobile-logo">
        <img src="../assets/logo.png" alt="Digital ZN" />
        <span class="mobile-wordmark">Digital<em>ZN</em></span>
      </div>

      <div class="form-header">
        <div class="form-kicker">
          <span class="kicker-dot"></span>
          <span>Business Suite</span>
        </div>
        <h2 class="form-title">Administrator<br /><em>Login</em></h2>
        <p class="form-subtitle">Restricted access — authorised personnel only.</p>
      </div>

      <form id="login-form" autocomplete="on" novalidate>

        <div class="field-group">
          <label for="email">Email</label>
          <div class="field-wrap">
            <span class="field-icon">✉</span>
            <input id="email" type="email" placeholder="admin@digital-zn.com"
              required autocomplete="email" />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="field-wrap">
            <span class="field-icon">⬤</span>
            <input id="password" type="password" placeholder="••••••••••••"
              required autocomplete="current-password" />
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-signin" id="btn-signin">
          <span id="btn-label">Sign In</span>
          <span class="btn-arrow">→</span>
          <span class="btn-spinner" id="btn-spinner" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
          </span>
        </button>

        <p id="error" class="error-msg" role="alert"></p>

      </form>

      <p class="form-note">© <span id="year"></span> Digital ZN. All rights reserved.</p>
    </div>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Password visibility toggle
    const pw = document.getElementById('password');
    document.getElementById('toggle-pw').addEventListener('click', () => {
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });
  </script>
  <script src="login.js"></script>
</body>
</html>
